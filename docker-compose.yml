services:
  app:
    image: '${IMAGE:-unified-cdn}'
    build:
      context: .
      dockerfile: Dockerfile.docker
      secrets:
        - envfile
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-3000}:3000'
    mem_limit: ${MEM_LIMIT:-512m}
    memswap_limit: ${MEMSWAP_LIMIT:-1g}
    env_file:
      - .env
secrets:
  envfile:
    file: .env